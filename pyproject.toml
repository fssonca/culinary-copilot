[project]
name = "culinary-copilot"
version = "0.1.0"
description = "Epicure culinary copilot backend"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Fernando Sousa", email = "fssonca@gmail.com" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "huggingface-hub>=0.30,<2",
    "numpy>=2.2,<3",
    "safetensors>=0.5,<1",
    "openai>=3.16.2",
]

[project.scripts]
culinary-copilot = "culinary_copilot:main"
import-recipes = "culinary_copilot.recipes.import_data:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=2.3.1", "pytest>=9.1.1", "httpx>=0.28,<1", "ruff>=0.16.4"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
