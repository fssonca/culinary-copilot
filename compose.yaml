services:
  db:
    # Pinned pgvector image (Phase 6): the application database already runs
    # this exact digest with migration 004 applied (vector extension +
    # recipe_embeddings). Reverting to stock `postgres:17` is UNSAFE: the
    # stock image cannot load `vector` objects and the database would fail
    # to start. Recover via the documented revert SQL or a verified backup,
    # never by swapping the image alone.
    image: pgvector/pgvector:pg17-trixie@sha256:724a4041afdb1750446e3f6b5cfa8f3b0ac5a2cf538ddfa6bfee4f94c2fa85c6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-culinary_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - backend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-copilot}:${POSTGRES_PASSWORD:-copilot_dev}@db:5432/${POSTGRES_DB:-culinary_copilot}
      HF_HOME: /app/.cache/huggingface
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - huggingface_cache:/app/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
volumes:
  backend_postgres_data:
  huggingface_cache:
