name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    # The DB tests create and drop their own disposable databases on this
    # server (never an application database). Without it they cannot
    # connect: CI failed from 2026-09-28 until this service was added.
    services:
      db:
        # Same pinned pgvector image as compose.yaml.
        image: pgvector/pgvector:pg17-trixie@sha256:724a4041afdb1750446e3f6b5cfa8f3b0ac5a2cf538ddfa6bfee4f94c2fa85c6
        env:
          POSTGRES_DB: culinary_copilot
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot -d culinary_copilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: "3.13"
      - run: uv sync --locked
      - run: make check
      - run: cp .env.example .env
      # The service above holds 5432; the compose smoke test uses 5433.
      - run: docker compose up --build -d --wait
        env:
          POSTGRES_PORT: "5433"
      - run: curl --fail http://localhost:8000/health/ready
      - if: always()
        run: docker compose down
